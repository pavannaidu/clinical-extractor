bundle:
  name: medgemma

include:
  - resources/*.yml

sync:
  exclude:
    - docs/**
    - showcase/**
    - src/**/README.md
    - src/app/frontend/**
    - src/app/tests/**
    - tests/**
    - "**/.pages.json"

variables:
  app_name:
    description: Databricks App name (lowercase letters, digits and hyphens; at most 30 characters).
    default: clinical-${workspace.current_user.domain_friendly_name}
  lakebase_project:
    description: Existing Lakebase project ID; supply in local overrides or BUNDLE_VAR_lakebase_project.
  lakebase_branch:
    description: Existing Lakebase branch ID; supply in local overrides or BUNDLE_VAR_lakebase_branch.
  lakebase_database:
    description: Existing Lakebase database ID within the branch.
    default: clinical-extractor
  evaluation_experiment_name:
    description: MLflow experiment created by the bundle for app evaluations.
    default: /Shared/clinical-extractor-evaluations
  batch_experiment_name:
    description: MLflow experiment used by the Serverless GPU batch job.
    default: /Users/${workspace.current_user.userName}/medgemma-xgrammar
  catalog:
    default: main
  schema:
    default: mlops
  hf_secret_scope:
    description: Databricks secret scope containing the Hugging Face token.
    default: clinical-extractor
  hf_secret_key:
    description: Secret key within hf_secret_scope.
    default: hf_token

  # MedGemma serving
  medgemma_registered_model_name:
    default: medgemma_xgrammar_structured
  # Base name only; deployment, benchmark, and batch notebooks append the
  # workload suffix (for example, GPU_MEDIUM -> "-a10").
  medgemma_endpoint_name:
    default: medgemma-1_5-4b-xgrammar

  # Classic GPU cluster for the UDF batch job
  gpu_node_type:
    default: g5.2xlarge
  gpu_spark_version:
    default: "17.3.x-gpu-ml-scala2.13"

  # Fine-tuning and app evaluation
  finetune_registered_model_name:
    default: medgemma_xgrammar_finetuned
  qwen3_finetuned_registered_model_name:
    default: qwen3_vllm_structured
  qwen3_finetuned_endpoint_name:
    default: qwen3-4b-finetuned-vllm-endpoint
  evaluation_warehouse_id:
    description: Existing SQL warehouse ID; supply in local overrides or BUNDLE_VAR_evaluation_warehouse_id.

targets:
  dev:
    mode: development
    default: true
    # Resolve the workspace through --profile or DATABRICKS_HOST and authentication.
