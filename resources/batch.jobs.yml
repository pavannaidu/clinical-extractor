resources:
  jobs:
    prepare_batch_input:
      name: "[medgemma/batch] 1. Prepare Batch Input"
      environments:
        - environment_key: sgc
          spec:
            client: "4"
      tasks:
        - task_key: prepare_input
          environment_key: sgc
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../src/models/medgemma/batch/01_prepare_batch_input.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              input_table: "medgemma_batch_input"
              synthetic_replications: "50"

    batch_inference_udf:
      name: "[medgemma/batch] 2. Batch Inference (UDF)"
      parameters:
        - name: workload_type
          default: GPU_MEDIUM  # GPU_SMALL=T4, GPU_MEDIUM=A10, GPU_LARGE=A100
      job_clusters:
        - job_cluster_key: gpu
          new_cluster:
            spark_version: ${var.gpu_spark_version}
            node_type_id: ${var.gpu_node_type}
            num_workers: 2
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: batch_inference
          job_cluster_key: gpu
          notebook_task:
            notebook_path: ../src/models/medgemma/batch/02_batch_inference_udf.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_model_name: ${var.medgemma_registered_model_name}
              model_alias: "challenger"
              endpoint_name: ${var.medgemma_endpoint_name}
              workload_type: "{{job.parameters.workload_type}}"
              input_table: "medgemma_batch_input"
              output_table: "medgemma_batch_output"
              experiment_name: ${var.batch_experiment_name}

    batch_inference_sgc:
      name: "[medgemma/batch] 3. Batch Inference (SGC)"
      environments:
        - environment_key: sgc
          spec:
            client: "4"
      tasks:
        - task_key: batch_inference
          environment_key: sgc
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../src/models/medgemma/batch/03_batch_inference_sgc.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              hf_model_name: "google/medgemma-1.5-4b-it"
              input_table: "medgemma_batch_input"
              output_table: "medgemma_batch_output_sgc"
              num_gpus: "2"
              batch_size: "32"
              experiment_name: ${var.batch_experiment_name}
