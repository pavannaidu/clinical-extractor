resources:
  jobs:
    finetune_medgemma:
      name: "[finetune] QLoRA Fine-tune MedGemma"
      environments:
        - environment_key: sgc
          spec:
            client: "4"
      tasks:
        - task_key: finetune
          environment_key: sgc
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../src/models/medgemma/finetune.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_model_name: ${var.finetune_registered_model_name}
              endpoint_name: "medgemma-finetuned-endpoint"
              workload_type: "GPU_MEDIUM"
              scale_to_zero: "true"
              hf_model_name: "google/medgemma-1.5-4b-it"
              hf_secret_scope: ${var.hf_secret_scope}
              hf_secret_key: ${var.hf_secret_key}
              lora_rank: "16"
              lora_alpha: "32"
              num_epochs: "3"
              learning_rate: "2e-4"
              max_seq_length: "2048"
              num_training_examples: "50"

    finetune_qwen3_disease:
      name: "[finetune] QLoRA Fine-tune Qwen3-4B for Disease Extraction"
      environments:
        - environment_key: ai_v6
          spec:
            environment_version: "6"
      tasks:
        - task_key: finetune
          environment_key: ai_v6
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../src/models/qwen/finetune_disease.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_model_name: ${var.qwen3_finetuned_registered_model_name}
              endpoint_name: ${var.qwen3_finetuned_endpoint_name}
              max_train_examples: "2048"
              max_eval_examples: "256"
              num_epochs: "1"
              learning_rate: "2e-4"
              max_seq_length: "1024"
